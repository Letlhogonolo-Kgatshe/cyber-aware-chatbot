name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore CyberAwareChatbot.sln
      - run: dotnet build CyberAwareChatbot.sln --no-restore -c Release
      - run: dotnet test CyberAwareChatbot.Tests --no-build -c Release --verbosity normal
